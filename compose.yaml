name: codatau-demo
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: codatau
      POSTGRES_USER: codatau
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codatau-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codatau -d codatau"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${WEB_PORT:-5055}:5000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-local-demo-key-change-for-cloud}
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://codatau:${POSTGRES_PASSWORD:-codatau-local-only}@db:5432/codatau}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-codatau-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_SELECTOR_ENABLED: ${AI_MODEL_SELECTOR_ENABLED:-1}
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 15
      start_period: 30s
volumes:
  postgres_data:
  app_data:
